[package]
name = "tyrant"
version = "2.0.0"
authors = ["incredibleplays"]
edition = "2018"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git = "https://github.com/theincredibleplayer/skyline-smash"}
smash_script = { git = "https://github.com/theincredibleplayer/smash-script", branch = "development" }
smashline = { git = "https://github.com/HDR-Development/smashline"}
smash_singletons = { git = "https://github.com/WuBoytH/smash_singletons.git" }
smash_rs = { package = "smash", git = "https://github.com/WuBoytH/smash-rs" }
arcropolis-api = { git = "https://github.com/Raytwo/arcropolis_api" }


[patch."https://github.com/ultimate-research/skyline-smash"]
skyline_smash = { git = "https://github.com/theincredibleplayer/skyline-smash" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 'z'
panic = "abort"
lto = true
codegen-units = 1
